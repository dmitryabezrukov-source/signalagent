function saDemoStart(){
 const stream=document.getElementById('sa-demo-messages'),leads=document.getElementById('sa-demo-leads'),pause=document.getElementById('sa-demo-pause');
 if(!stream||!leads||!pause)return;
 const data=[
 ['Автоклуб Geely','Кто в Питере делает кузовной ремонт Coolray? Нужен мастер после ДТП.','Кузовной ремонт','Кузовной ремонт Geely Coolray','Санкт-Петербург · Автосервис'],
 ['Чат скидок','Сегодня акция на аксессуары для авто: минус 30%!',null],
 ['Автолюбители Казани','Нужен специалист по автоподбору Kia Sportage с пробегом. Бюджет до 2 млн.','Автоподбор','Поиск подборщика Kia Sportage','Казань · Подбор авто'],
 ['Клуб Haval','Подскажите диагноста по электрике Haval Jolion в Краснодаре.','Автоэлектрика','Нужен диагност для Haval Jolion','Краснодар · Электрика'],
 ['Обсуждение маршрутов','На трассе М4 вечером снова пробки, выезжайте заранее.',null],
 ['Местный автоклуб','Где записаться на шиномонтаж с хранением шин в Самаре на выходных?','Шиномонтаж','Запись на шиномонтаж и хранение','Самара · Автосервис'],
 ['Автомобили с пробегом','Ищу человека для проверки машины перед покупкой, бюджет до 1,5 млн.','Проверка авто','Проверка машины перед покупкой','Автоподбор · С пробегом'],
 ['Запчасти для Kia','Кто может привезти коробку передач на Kia Rio и установить?','Запчасти и установка','Заказ КПП на Kia Rio с установкой','Запчасти · Установка']
 ];let pos=0,scanned=6,matched=3,stopped=false;
 const make=(tag,cls,t)=>{const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=t;return el};
 function advance(){if(stopped||!stream.isConnected)return;const d=data[pos++%data.length],hit=!!d[2];scanned++;
 const msg=make('div','sa-demo-message sa-demo-enter '+(hit?'sa-demo-positive':'sa-demo-negative'),'');
 const header=make('div','','');header.append(make('b','',d[0]),make('small','',hit?'Запрос найден':'Не подходит'));
 msg.append(header,make('p','',d[1]));stream.prepend(msg);
 while(stream.children.length>3)stream.lastElementChild.remove();
 document.getElementById('sa-demo-scanned').textContent=String(scanned).padStart(2,'0');
 if(hit){matched++;document.getElementById('sa-demo-count').textContent=String(matched).padStart(2,'0');
 const item=make('div','sa-demo-lead sa-demo-enter','');
 item.append(make('span','','● '+d[2].toUpperCase()),make('strong','',d[3]),make('small','',d[4]),make('div','','Смотреть первоисточник ↗'));
 leads.prepend(item);while(leads.children.length>2)leads.lastElementChild.remove();}
 }
 pause.addEventListener('click',()=>{stopped=!stopped;pause.textContent=stopped?'▶ Продолжить':'⏸ Пауза';pause.setAttribute('aria-pressed',String(stopped))});
 let timer=setInterval(()=>{if(!stream.isConnected){clearInterval(timer);return}advance()},4000);
}

function audience(){return `<section class="section" id="audience"><div class="container"><span class="kicker">Для какого бизнеса</span><div class="section-head"><div><h2>Одна платформа.<br>Разные сценарии.</h2><p class="section-sub">Направление влияет на рекомендации и примеры, но не ограничивает доступ к модулям.</p></div></div><div class="audience"><div class="audience-card"><span class="kicker">B2B</span><h3>Если продаёте компаниям</h3><p>Продажи с поиском ЛПР, длительными переговорами, тендерами и персональными предложениями.</p><ul><li>Поиск компаний по бизнес-событиям</li><li>ЛПР, тендеры, персональные письма</li><li>Контроль КП, сделок и повторных касаний</li></ul><button class="btn outline small" style="margin-top:21px" data-jump-seg="b2b">Посмотреть модули B2B ${icon('arrow',15)}</button></div><div class="audience-card special"><span class="kicker">B2C</span><h3>Если продаёте людям</h3><p>Быстрая обработка заявок, реклама, поиск реальных запросов и повторные покупки.</p><ul><li>Спрос в Telegram и на форумах</li><li>Реклама, сайты и формы заявки</li><li>Ответы клиентам и возврат покупателей</li></ul><button class="btn outline small" style="margin-top:21px" data-jump-seg="b2c">Посмотреть модули B2C ${icon('arrow',15)}</button></div></div></div></section>`}
function strengths(){return `<section class="section deep"><div class="container" style="position:relative;z-index:1"><span class="kicker">Наш подход</span><div class="section-head"><div><h2>Не набор ИИ-кнопок.<br>Система коммерческих действий.</h2><p class="section-sub">Модули должны помогать бизнесу проходить путь от обнаружения потребности до оплаченного заказа — с возможностью контроля каждого шага.</p></div></div><div class="trust-row"><div class="trust-item"><strong>Общий контекст бизнеса</strong><p>Услуги, цены, кейсы и правила компании используются в разных подключённых модулях.</p></div><div class="trust-item"><strong>Человек контролирует важное</strong><p>Сообщения, рекламные размещения и публикации могут требовать согласования и проверки.</p></div><div class="trust-item"><strong>Результат важнее действий</strong><p>Переходим от подсчёта найденных сообщений к заявкам, встречам и реальным продажам.</p></div></div></div></section>`}
function faq(){return `<section class="section" id="faq"><div class="container"><span class="kicker">Частые вопросы</span><h2>Вопросы о платформе</h2><div class="faq-list"><details class="faq-item"><summary>Нужно ли покупать сразу все модули?</summary><p>Нет. Мы проектируем их как самостоятельные решения. Можно начать с одной задачи и подключать дополнительные возможности.</p></details><details class="faq-item"><summary>Что выбрать — B2B или B2C?</summary><p>Переключение предназначено только для удобства просмотра. Если компания продаёт и бизнесу, и частным лицам, можно использовать оба направления.</p></details><details class="faq-item"><summary>SignalAgent заменит мою CRM?</summary><p>Не обязательно. В концепции предусмотрены как собственная облегчённая CRM, так и интеграции с существующими системами.</p></details><details class="faq-item"><summary>ИИ будет всё делать самостоятельно?</summary><p>Зависит от задачи. Подготовку информации можно автоматизировать глубже, а сообщения, рекламные бюджеты и публикации должны выполняться с необходимым контролем и соблюдением правил площадок.</p></details><details class="faq-item"><summary>Можно уже подключить платформу и оплатить подписку?</summary><p>Это предварительный сайт для обсуждения концепции. Работающие кабинеты, интеграции, тарифы и обработка заявок здесь пока не подключены.</p></details></div></div></section>`}
function finalCta(){return `<section class="section" style="padding-top:10px"><div class="container"><div class="cta-band"><div><h2>Давайте обсудим,<br>как это может работать.</h2><p>Покажем продуктовую концепцию, приоритеты разработки и варианты партнёрства.</p></div><button class="btn primary" data-request="Обсудить SignalAgent">Обсудить проект ${icon('arrow',17)}</button></div></div></section>`}
function home(){document.title='SignalAgent.ru — ИИ-платформа для роста продаж';return header()+hero()+capabilities()+modulesSection()+saDemoSection()+howSection()+audience()+strengths()+faq()+finalCta()+footer()}
function modulePage(m){let related=mods.filter(x=>x.slug!==m.slug&&(x.group===m.group||x.for.some(s=>m.for.includes(s)))).slice(0,3);
return header()+`<main><section class="module-hero"><div class="container"><div class="crumbs"><a href="/">Главная</a> / <a href="/#modules">Модули</a> / <span>${esc(m.name)}</span></div><div class="module-hero-wrap"><div><div class="module-badge">${esc(m.kind)} · Модуль ${m.n}</div><h1 class="module-title">${esc(m.name)}</h1><div class="module-lead">${esc(m.lead)}</div><p>${esc(m.description)}</p><div class="hero-actions"><button class="btn primary" data-request="Интересует модуль: ${esc(m.name)}">Обсудить модуль ${icon('arrow',17)}</button><a class="btn outline" href="/#modules">Все модули</a></div></div><div class="feature-panel"><div class="panel-header"><span class="panel-title">${esc(m.tag)}</span><span class="panel-status">Концепция</span></div><h3>Что будет внутри</h3>${m.features.slice(0,4).map(f=>`<div class="panel-line"><span class="check">✓</span><span>${esc(f[0])}</span></div>`).join('')}<p style="font-size:11px;color:#859385;margin:18px 0 0">Иллюстрация возможностей, а не скриншот действующего кабинета.</p></div></div></div></section>
<section class="section"><div class="container"><span class="kicker">Что меняется для бизнеса</span><div class="two-col"><div class="problem-card"><h3>Что мешает продавать</h3><p>${esc(m.problem)}</p></div><div class="solution-card"><h3>Как помогает SignalAgent</h3><p>${esc(m.benefit)}</p></div></div></div></section>
<section class="section tinted"><div class="container"><span class="kicker">Возможности модуля</span><div class="section-head"><div><h2>Задачи, которые можно<br>передать системе</h2><p class="section-sub">Набор функций для проектирования и обсуждения с командой разработки.</p></div></div><div class="feature-grid">${m.features.map((f,i)=>`<article class="feature-card"><span class="feature-counter">ВОЗМОЖНОСТЬ ${String(i+1).padStart(2,'0')}</span><h3>${esc(f[0])}</h3><p>${esc(f[1])}</p></article>`).join('')}</div></div></section>
<section class="section" id="process"><div class="container"><span class="kicker">Сценарий использования</span><div class="section-head"><div><h2>Как это будет работать</h2><p class="section-sub">Простой путь от настройки до измеримого действия.</p></div></div><div class="steps">${m.how.map((x,i)=>`<article class="step-card"><div class="step-no">ШАГ ${String(i+1).padStart(2,'0')}</div><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></article>`).join('')}</div></div></section>
<section class="section tinted"><div class="container"><div class="two-col"><div><span class="kicker">Примеры применения</span><h2 style="font-size:34px;margin:0 0 22px">Когда модуль особенно полезен</h2><ul class="bullets">${m.cases.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><span class="kicker">Что измерять</span><h2 style="font-size:34px;margin:0 0 22px">Результат в цифрах</h2><div style="display:grid;gap:10px">${m.metrics.map((x,i)=>`<div class="metric"><strong>${esc(x)}</strong><small>Показатель для настройки аналитики</small></div>`).join('')}</div></div></div></div></section>
<section class="section"><div class="container"><span class="kicker">Разбираем детали</span><h2>Вопросы о модуле</h2><div class="faq-list">${m.faq.map(x=>`<details class="faq-item"><summary>${esc(x[0])}</summary><p>${esc(x[1])}</p></details>`).join('')}<details class="faq-item"><summary>Когда модуль будет доступен?</summary><p>Сейчас это продуктовая концепция. Сроки запуска и конкретный состав первой версии будут согласованы по результатам разработки и пилотирования.</p></details></div></div></section>
<section class="section tinted"><div class="container"><span class="kicker">Другие направления</span><div class="section-head"><h2>Может быть полезно вместе</h2><a class="btn outline small" href="/#modules">Все модули ${icon('arrow',14)}</a></div><div class="related-grid">${related.map(x=>`<a class="related-card" href="${url(x)}"><div class="module-icon" style="--card-color:${x.accent}">${icon(x.icon,20)}</div><strong>${esc(x.name)} ↗</strong><span>${esc(x.short)}</span></a>`).join('')}</div></div></section>
${finalCta()}</main>`+footer()}
function requestModal(){let div=document.createElement('div');div.id='modal-root';document.body.append(div);function close(){div.innerHTML='';body.classList.remove('lock')};document.addEventListener('click',e=>{const r=e.target.closest('[data-request]');if(r){e.preventDefault();const topic=r.dataset.request||'Обсудить SignalAgent';div.innerHTML=`<div class="modal-overlay" role="presentation" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close" aria-label="Закрыть" id="modal-close">×</button><span class="kicker">Обсуждение концепции</span><h2 id="modal-title">Расскажите, что вам интересно</h2><p>Это демонстрационный сайт. Отправка заявок пока не подключена, но можно сформировать текст запроса и скопировать его.</p><label class="demo-label" for="form-name">Как к вам обращаться</label><input class="demo-input" id="form-name" placeholder="Имя"><label class="demo-label" for="form-contact">Контакт для связи</label><input class="demo-input" id="form-contact" placeholder="Email или Telegram"><label class="demo-label" for="form-interest">Что хотели бы обсудить</label><textarea class="demo-input" id="form-interest" rows="3">${esc(topic)}</textarea><div class="modal-status" id="modal-status" aria-live="polite"></div><button class="btn primary" id="copy-request">Скопировать текст запроса ${icon('arrow',16)}</button><p class="demo-hint">Никакие введённые сведения никуда не отправляются и не сохраняются на сервере. Передайте скопированный запрос удобным способом.</p></div></div>`;body.classList.add('lock');div.querySelector('#modal-close').focus();return}
if(e.target.id==='overlay'||e.target.closest('#modal-close'))close();if(e.target.closest('#copy-request')){let nm=document.getElementById('form-name').value.trim(),contact=document.getElementById('form-contact').value.trim(),interest=document.getElementById('form-interest').value.trim();let msg=`SignalAgent.ru — запрос на обсуждение\nИмя: ${nm||'Не указано'}\nКонтакт: ${contact||'Не указан'}\nИнтерес: ${interest||'Обсуждение продукта'}`;let done=()=>document.getElementById('modal-status').textContent='Текст заявки скопирован. Можно отправить его партнёру или разработчику.';if(navigator.clipboard?.writeText){navigator.clipboard.writeText(msg).then(done,()=>fallback(msg))}else fallback(msg);function fallback(s){let ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(_){document.getElementById('modal-status').textContent='Выделите и скопируйте текст вручную.'}ta.remove()}}});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()})}
function init(){document.getElementById('app').innerHTML=page==='module'?(modulePage(mods.find(x=>x.slug===slug)||mods[0])):home();
if(page==='home')saDemoStart();
if(page==='module'){document.title=(mods.find(x=>x.slug===slug)||mods[0]).name+' — SignalAgent.ru'}
const mb=document.getElementById('mobile'),nav=document.getElementById('nav');if(mb)mb.addEventListener('click',()=>{let open=nav.classList.toggle('open');mb.setAttribute('aria-expanded',String(open))});nav?.addEventListener('click',()=>{nav.classList.remove('open');mb?.setAttribute('aria-expanded','false')});
requestModal();
let top=document.getElementById('back-top');top.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));window.addEventListener('scroll',()=>top.classList.toggle('show',window.scrollY>650),{passive:true});
if(page==='home') {document.addEventListener('click',e=>{let seg=e.target.closest('[data-seg]');if(seg){segment=seg.dataset.seg;try{localStorage.setItem('sa-segment',segment)}catch(e){};renderMods()};let cat=e.target.closest('[data-category]');if(cat){category=cat.dataset.category;renderMods()};let jump=e.target.closest('[data-jump-seg]');if(jump){segment=jump.dataset.jumpSeg;category='all';try{localStorage.setItem('sa-segment',segment)}catch(e){};renderMods();document.querySelector('#modules')?.scrollIntoView({behavior:'smooth'})}})}
}
function renderMods(){document.querySelectorAll('[data-seg]').forEach(b=>{b.classList.toggle('active',b.dataset.seg===segment);b.setAttribute('aria-pressed',String(b.dataset.seg===segment))});document.querySelectorAll('[data-category]').forEach(b=>{b.classList.toggle('active',b.dataset.category===category);b.setAttribute('aria-pressed',String(b.dataset.category===category))});let shown=mods.filter(m=>(segment==='all'||m.for.includes(segment))&&(category==='all'||m.group===category));let el=document.querySelector('#module-grid');if(el)el.innerHTML=shown.length?shown.map(card).join(''):'<div class="empty">В выбранной категории пока нет модулей для этого направления.</div>';let t=document.getElementById('filter-text');if(t)t.textContent=segment==='b2b'?'Показаны модули для работы с корпоративными клиентами.':segment==='b2c'?'Показаны модули для работы с частными покупателями.':'Показаны все модули. Переключение — необязательная настройка.';let old=document.querySelector('.visual');if(old){let html=preview();let tmp=document.createElement('div');tmp.innerHTML=html;old.replaceWith(tmp.firstElementChild)}}
init();
})();
</script></body></html>
